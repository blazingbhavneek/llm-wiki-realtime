[project]
name = "llm-wiki-realtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "livekit>=1.1.14",
    "livekit-agents>=1.6.8",
    "livekit-api>=1.2.0",
    "livekit-plugins-openai>=1.6.8",
    "livekit-plugins-silero>=1.6.8",
    "python-dotenv>=1.2.2",
    "trustme>=1.2.1",
    "uvicorn>=0.52.1",
]

# Only the machine that hosts Supertonic locally needs the ONNX stack. The
# agent process talks to it over HTTP, so `uv sync` on an agent-only host
# installs none of this: `uv sync --extra supertonic` on the TTS host.
[project.optional-dependencies]
supertonic = [
    "supertonic>=1.3.1",
    "soundfile",
    "numpy",
    "huggingface-hub",
]

# The four processes. `python -m app`, `python -m app.stt.nemotron` and friends
# stay the documented commands and need no install; these are the same entry
# points as console scripts, available once `uv sync` has installed the project.
[project.scripts]
wiki-agent = "app.runtime.worker:main"
wiki-asr = "app.stt.nemotron:main"
wiki-tts = "app.tts.supertonic:main"
wiki-rag-stub = "app.rag.placeholder:main"

# Without a build backend the project is not a package, so `app` is not
# importable from an install and console scripts cannot exist.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
