services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    # Host networking avoids NAT for the WebRTC UDP media port - the
    # standard setup for a self-hosted LiveKit server on Linux.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]

  livekit-tls-proxy:
    image: caddy:2
    container_name: livekit-tls-proxy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit-server
    # The Caddyfile reads this as {$PUBLIC_HOST}; compose takes it from .env,
    # so the browser-facing address is configured in one place.
    environment:
      PUBLIC_HOST: "${PUBLIC_HOST:?set PUBLIC_HOST in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
  caddy_config:
